[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "world-narrative-ltx2"
version = "0.1.0"
description = "Long-horizon world narrative training scaffold on LTX-2"
requires-python = ">=3.10"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["world_narrative*", "ltx2*", "fastvideo*"]
